name: Android build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: poppler (rendered-comparison tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Unit and UI tests
        run: ./gradlew --no-daemon :forensics:testDebugUnitTest :app:testDebugUnitTest
      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Release APK (R8) compiles
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            forensics/build/reports/tests
            app/build/reports/tests
            app/build/reports/screens
